<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telefones — Acionar Corretora de Seguros</title>
<meta name="theme-color" content="#EB6522">
<meta name="robots" content="noindex, nofollow">
<!-- Sem og:image de propósito: a imagem do cartão já vai na conversa, e uma
     segunda peça grande logo acima do link só repetia a mesma marca. A prévia
     fica só com o texto. -->
<meta property="og:title" content="Telefones da sua seguradora">
<meta property="og:description" content="Toque para ligar.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="pagina.css">
</head>
<body>
  <header class="topo">
    <img class="topo__logo" src="../assets/logo-acionar.png" alt="Acionar Corretora de Seguros">
  </header>

  <main class="folha">
    <h1 id="titulo" class="titulo">Carregando…</h1>

    <div id="erro" class="erro" hidden></div>

    <div id="telefones" class="telefones"></div>

    <button id="btnContato" class="botao botao--primario" type="button" hidden>
      Salvar na minha agenda
    </button>

    <div id="telefonesCorretora" class="telefones telefones--claro"></div>
  </main>

  <script src="pagina.js"></script>
</body>
</html>
